<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Raj Koiri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">
    <main class="contact-shell">
        <section class="contact-intro">
            <a class="back-link" href="index.html">&larr; Back to portfolio</a>
            <p class="eyebrow">LET'S CONNECT</p>
            <h1>Have a project<br><em>in mind?</em></h1>
            <p class="intro-copy">Whether you have an idea to explore or simply want to say hello, send a message and I'll get back to you soon.</p>
            <div class="contact-detail">
                <span class="detail-icon">@</span>
                <div>
                    <span class="detail-label">Email me</span>
                    <a href="mailto:rajkoiri@example.com">rajkoiri@example.com</a>
                </div>
            </div>
        </section>

        <form class="contact-form" id="contactForm" action="#" method="post">
            <div class="form-heading">
                <span>01</span>
                <h2>Send a message</h2>
            </div>

            <label for="name">Your name</label>
            <input type="text" id="name" name="name" placeholder="Jane Smith" autocomplete="name" required>

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" required>

            <label for="message">How can I help?</label>
            <textarea id="message" name="message" placeholder="Tell me a little about your idea..." rows="5" required></textarea>

            <button type="submit">Send message <span>&rarr;</span></button>
        </form>
    </main>
</body>
<script>
    const form = document.querySelector("#contactForm");

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        const name = document.querySelector("#name").value;
        form.textContent = "Thanks, " + name + "! I will reply soon.";
    });
</script>
</html>
